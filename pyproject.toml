[project]
name = "central-heating"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-homeassistant-custom-component==0.13.375", "ruff==0.17.4", "tzdata>=2026.1"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: Home Assistant integration tests"]
